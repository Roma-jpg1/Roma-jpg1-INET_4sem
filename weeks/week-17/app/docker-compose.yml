version: "3.9"

services:

  like-service:
    build:
      context: .
      dockerfile: like_service/Dockerfile

    ports:
      - "8001:8000"
      - "50051:50051"

    depends_on:
      like-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  post-service:
    build:
      context: .
      dockerfile: post_service/Dockerfile

    ports:
      - "8002:8000"

    depends_on:
      post-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  user-service:
    build:
      context: .
      dockerfile: user_service/Dockerfile

    ports:
      - "8003:8000"

    depends_on:
      user-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  like-db:
    image: postgres

    environment:
      POSTGRES_DB: like_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d like_service_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  post-db:
    image: postgres

    environment:
      POSTGRES_DB: post_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d post_service_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-db:
    image: postgres

    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service_db"]
      interval: 5s
      timeout: 3s
      retries: 10
