apiVersion: apps/v1
kind: Deployment
metadata:
  name: like-db
  namespace: likes-s18
spec:
  replicas: 1
  selector:
    matchLabels:
      app: like-db
  template:
    metadata:
      labels:
        app: like-db
    spec:
      containers:
        - name: like-db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: like_service_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d like_service_db
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d like_service_db
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: like-db
  namespace: likes-s18
spec:
  selector:
    app: like-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
