apiVersion: apps/v1
kind: Deployment
metadata:
  name: like-service
  namespace: likes-s18
spec:
  replicas: 2
  selector:
    matchLabels:
      app: like-service
  template:
    metadata:
      labels:
        app: like-service
    spec:
      containers:
        - name: like-service
          image: ghcr.io/example/likes-s18-like-service:latest
          ports:
            - containerPort: 8000
            - containerPort: 50051
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: like-service
  namespace: likes-s18
spec:
  selector:
    app: like-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP
