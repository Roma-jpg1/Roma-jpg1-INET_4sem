name: Week 17 CD

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/week-17-cd.yml"
      - "weeks/week-17/**"

permissions:
  contents: read
  packages: write

env:
  K8S_NAMESPACE: likes-s18

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run week-17 tests
        run: make test WEEK=17

  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: like-service
            dockerfile: like_service/Dockerfile
          - service: post-service
            dockerfile: post_service/Dockerfile
          - service: user-service
            dockerfile: user_service/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: weeks/week-17/app
          file: weeks/week-17/app/${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/week-17-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' && secrets.KUBE_CONFIG_DATA != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > "$HOME/.kube/config"

      - name: Apply manifests
        run: |
          kubectl apply -f weeks/week-17/k8s/namespace.yaml
          kubectl apply -f weeks/week-17/k8s/

      - name: Update images to current commit
        run: |
          kubectl -n "${K8S_NAMESPACE}" set image deployment/like-service like-service=ghcr.io/${{ github.repository }}/week-17-like-service:${{ github.sha }}
          kubectl -n "${K8S_NAMESPACE}" set image deployment/post-service post-service=ghcr.io/${{ github.repository }}/week-17-post-service:${{ github.sha }}
          kubectl -n "${K8S_NAMESPACE}" set image deployment/user-service user-service=ghcr.io/${{ github.repository }}/week-17-user-service:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/like-service --timeout=180s
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/post-service --timeout=180s
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/user-service --timeout=180s
